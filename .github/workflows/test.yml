name: Test

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - ^22.23.4
          - ^24.22.1
          - ^26.13.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          require-lockfile: true

      - name: Build
        run: pnpm run build

      - name: Linter test
        run: |
          pnpm run lint:check
